<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Alerts App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Weather Alerts App</h1>
  <form id="weather-form">
  <label for="state-input">Enter a us state abbreviation:</label>
  <input
    type="text"
    id="state-input"
    placeholder="e.g. texas"
    maxlength="20"
    required
  />
  <button type="submit">Get Alerts</button>
</form>

<div id="error-message" role="alert"></div>
<section id="alerts-display" aria-live="polite"></section>
</body>
</html>
